name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  BUN_VERSION: '1.4.5'
  # linuxdeploy ships as an AppImage; extract it instead of relying on FUSE,
  # which current ubuntu-24.04 runners do not provide.
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  build-macos-arm64:
    needs: quality
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: bun install --frozen-lockfile
      - run: bun run sidecar:fetch
      - run: bun run sidecar:smoke
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: barklarm-macos-arm64
          path: src-tauri/target/release/bundle/**/*

  build-macos-x64:
    needs: quality
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: bun install --frozen-lockfile
      - run: bun run sidecar:fetch
      - run: bun run sidecar:smoke
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: barklarm-macos-x64
          path: src-tauri/target/release/bundle/**/*

  build-linux-x64:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run:
          sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          librsvg2-dev patchelf libssl-dev
      - run: bun install --frozen-lockfile
      - run: bun run sidecar:fetch
      - run: bun run sidecar:smoke
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: barklarm-linux-x64
          path: src-tauri/target/release/bundle/**/*

  build-linux-arm64:
    needs: quality
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run:
          sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          librsvg2-dev patchelf libssl-dev
      - run: bun install --frozen-lockfile
      - run: bun run sidecar:fetch
      - run: bun run sidecar:smoke
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: barklarm-linux-arm64
          path: src-tauri/target/release/bundle/**/*

  build-windows-x64:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: bun install --frozen-lockfile
      - run: bun run sidecar:fetch
      - run: bun run sidecar:smoke
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: barklarm-windows-x64
          path: src-tauri/target/release/bundle/**/*

  release:
    needs:
      - build-macos-arm64
      - build-macos-x64
      - build-linux-x64
      - build-linux-arm64
      - build-windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.msi
            artifacts/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
