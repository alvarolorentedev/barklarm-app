[package]
name = "barklarm"
version = "4.0.2"
description = "Build & Observability Radiator"
authors = ["Alvaro Lorente"]
license = "MIT"
repository = "https://github.com/alvarolorentedev/barklarm-app"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "barklarm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-http = { version = "2.9.0", features = ["dangerous-settings"] }
tauri-plugin-notification = "2.8.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-clipboard-manager = "2.5.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
sha2 = "0.11.2"
sysinfo = "0.40.4"
keyring = "4.2.0"
rand = "0.9"
tokio = { version = "1", features = ["process", "time", "sync", "fs", "io-util", "rt"] }
futures-util = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFString", "CFURL"] }
objc2-core-services = { version = "0.3.2", default-features = false, features = ["std", "LaunchServices", "LSInfo"] }
block2 = "0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = "0.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
