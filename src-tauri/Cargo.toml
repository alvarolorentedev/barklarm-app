[package]
name = "barklarm"
version = "3.0.0"
description = "Build & Observability Radiator"
authors = ["Alvaro Lorente"]
license = "MIT"
repository = "https://github.com/alvarolorentedev/barklarm-app"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "barklarm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-http = { version = "2.9.0", features = ["dangerous-settings"] }
tauri-plugin-notification = "2.8.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
block2 = "0.6.2"
